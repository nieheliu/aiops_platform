services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiops-backend
    ports:
      - "8080:8080"
    environment:
      ARK_API_KEY: ${ARK_API_KEY:-}

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aiops-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
